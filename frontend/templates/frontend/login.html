{% extends "frontend/base.html" %}
{% block title %}Connexion — Covoiturage{% endblock %}

{% block content %}
<section class="w-full min-h-[70vh] flex items-center justify-center px-6 py-16">
    <div class="card rounded-2xl p-8 w-full max-w-md">
        <div class="flex items-center gap-3 mb-8 justify-center">
            <div class="w-12 h-12 rounded-full bg-brand-500 flex items-center justify-center font-bold text-black text-xl">C</div>
            <span class="text-2xl font-bold">Covoiturage</span>
        </div>

        <h1 class="text-xl font-semibold text-center mb-6">Connexion</h1>

        <div id="login-error" class="hidden mb-4 p-3 rounded-lg bg-red-500/20 text-red-400 text-sm"></div>

        <form id="login-form" class="space-y-5" onsubmit="return handleLogin(event)">
            <div>
                <label class="block text-sm text-muted mb-1.5">Nom d’utilisateur</label>
                <input id="login-username" type="text" required autofocus
                       class="w-full px-4 py-3 rounded-xl elevated border border-soft focus:outline-none focus:ring-2 focus:ring-brand-500/50 text-sm">
            </div>
            <div>
                <label class="block text-sm text-muted mb-1.5">Mot de passe</label>
                <input id="login-password" type="password" required
                       class="w-full px-4 py-3 rounded-xl elevated border border-soft focus:outline-none focus:ring-2 focus:ring-brand-500/50 text-sm">
            </div>
            <button type="submit" class="w-full py-3.5 rounded-xl bg-brand-500 text-black font-bold hover:bg-brand-400 transition">
                Se connecter
            </button>
        </form>

        <p class="text-center text-sm text-muted mt-6">
            Pas encore de compte ?
            <a href="{% url 'frontend:register' %}" class="text-brand-500 hover:underline">S’inscrire</a>
        </p>
    </div>
</section>
{% endblock %}

{% block extra_js %}

<script>
async function handleLogin(e) {
    e.preventDefault();
    const errorEl = document.getElementById('login-error');
    errorEl.classList.add('hidden');

    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;

    try {
        const res = await fetch('/api/auth/login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
            localStorage.setItem('access_token', data.access);
            localStorage.setItem('refresh_token', data.refresh);

            // Créer aussi la session Django
            await fetch('/api/session-login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            window.location.href = '/';
        } else {
            errorEl.textContent = data.detail || 'Identifiants incorrects';
            errorEl.classList.remove('hidden');
        }
    } catch (err) {
        errorEl.textContent = 'Erreur réseau';
        errorEl.classList.remove('hidden');
    }
    return false;
}
</script>

{% endblock %}
