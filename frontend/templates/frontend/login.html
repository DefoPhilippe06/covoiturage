{% extends "frontend/base.html" %}
{% block title %}Connexion — Covoiturage{% endblock %}

{% block content %}
<section class="w-full min-h-[calc(100vh-8rem)] flex items-center justify-center px-6 py-12 sm:py-16">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-full bg-brand-500 flex items-center justify-center font-bold text-black text-2xl mx-auto mb-4">C</div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Bon retour</h1>
            <p class="text-sm text-muted mt-2">Connectez-vous pour continuer</p>
        </div>

        <div class="card rounded-3xl p-6 sm:p-8 border border-white/5">
            <div id="login-error" class="hidden mb-4 p-3 rounded-xl bg-red-500/15 text-red-400 text-sm"></div>

            <form class="space-y-5" onsubmit="return handleLogin(event)">
                <div>
                    <label class="block text-[11px] uppercase tracking-wider text-muted mb-2 font-semibold">Nom d’utilisateur</label>
                    <input id="login-username" type="text" required autofocus
                           class="w-full px-4 py-3.5 rounded-2xl elevated border border-soft focus:outline-none focus:ring-2 focus:ring-brand-500/40 text-sm transition">
                </div>
                <div>
                    <label class="block text-[11px] uppercase tracking-wider text-muted mb-2 font-semibold">Mot de passe</label>
                    <input id="login-password" type="password" required
                           class="w-full px-4 py-3.5 rounded-2xl elevated border border-soft focus:outline-none focus:ring-2 focus:ring-brand-500/40 text-sm transition">
                </div>
                <button type="submit"
                        class="w-full py-3.5 rounded-2xl bg-brand-500 text-black font-bold text-sm hover:bg-brand-400 active:scale-[0.98] transition">
                    Se connecter
                </button>
            </form>
        </div>

        <p class="text-center text-sm text-muted mt-6">
            Pas encore de compte ?
            <a href="{% url 'frontend:register' %}" class="text-brand-500 font-semibold hover:underline">S’inscrire</a>
        </p>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
async function handleLogin(e) {
    e.preventDefault();
    const errorEl = document.getElementById('login-error');
    errorEl.classList.add('hidden');
    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;
    try {
        const res = await fetch('/api/auth/login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok) {
            localStorage.setItem('access_token', data.access);
            localStorage.setItem('refresh_token', data.refresh);
            await fetch('/api/session-login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            window.location.href = '/';
        } else {
            errorEl.textContent = data.detail || 'Identifiants incorrects';
            errorEl.classList.remove('hidden');
        }
    } catch {
        errorEl.textContent = 'Erreur réseau';
        errorEl.classList.remove('hidden');
    }
    return false;
}
</script>
{% endblock %}
