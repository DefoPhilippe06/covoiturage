{% extends "frontend/base.html" %}
{% block title %}Messages — Covoiturage{% endblock %}

{% block content %}
<section class="w-full px-6 sm:px-10 lg:px-16 py-8 h-[calc(100vh-8rem)]">
    <h1 class="text-2xl font-bold mb-6">Messages</h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 h-full">
        <!-- Liste conversations -->
        <div class="card rounded-2xl overflow-hidden flex flex-col lg:col-span-1">
            <div class="px-4 py-3 border-b border-soft font-medium text-sm text-muted">Conversations</div>
            <div id="conv-list" class="flex-1 overflow-y-auto">
                <p class="text-muted text-sm text-center py-10">Chargement...</p>
            </div>
        </div>

        <!-- Zone messages -->
        <div class="card rounded-2xl overflow-hidden flex flex-col lg:col-span-2">
            <div id="chat-header" class="px-4 py-3 border-b border-soft text-sm text-muted">
                Sélectionnez une conversation
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3">
            </div>
            <div id="chat-input-area" class="hidden p-4 border-t border-soft flex gap-2">
                <input id="msg-input" type="text" placeholder="Écrire un message..."
                       class="flex-1 px-4 py-2.5 rounded-xl elevated border border-soft text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/50"
                       onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()" class="px-5 py-2.5 rounded-xl bg-brand-500 text-black font-bold text-sm hover:bg-brand-400 transition">
                    Envoyer
                </button>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
let currentConvId = null;
const token = () => localStorage.getItem('access_token');

async function loadConversations() {
    if (!token()) { window.location.href = '/login/'; return; }
    const res = await fetch('/api/conversations/', {
        headers: { 'Authorization': 'Bearer ' + token() }
    });
    const data = await res.json();
    const convs = data.results || data;
    const el = document.getElementById('conv-list');

    if (!convs.length) {
        el.innerHTML = '<p class="text-muted text-sm text-center py-10">Aucune conversation.<br><span class="text-xs">Elles se créent à la réservation.</span></p>';
        return;
    }

    el.innerHTML = convs.map(c => {
        const names = (c.participants_usernames || []).join(', ');
        const last = c.messages && c.messages.length ? c.messages[c.messages.length - 1].content.slice(0, 40) : 'Aucun message';
        return `
            <button onclick="openConversation(${c.id})" class="w-full text-left px-4 py-3 hover:bg-white/5 border-b border-soft transition">
                <p class="font-medium text-sm truncate">${names}</p>
                <p class="text-xs text-muted truncate mt-0.5">${last}</p>
            </button>`;
    }).join('');
}

async function openConversation(id) {
    currentConvId = id;
    document.getElementById('chat-input-area').classList.remove('hidden');
    document.getElementById('chat-header').textContent = 'Conversation #' + id;

    const res = await fetch('/api/conversations/' + id + '/', {
        headers: { 'Authorization': 'Bearer ' + token() }
    });
    const conv = await res.json();
    const msgs = conv.messages || [];
    const box = document.getElementById('chat-messages');

    box.innerHTML = msgs.map(m => {
        const mine = m.sender_username === '{{ user.username }}';
        return `
            <div class="flex ${mine ? 'justify-end' : 'justify-start'}">
                <div class="max-w-[75%] px-4 py-2 rounded-2xl text-sm ${mine ? 'bg-brand-500 text-black' : 'elevated'}">
                    ${!mine ? `<p class="text-xs font-medium mb-0.5 opacity-70">${m.sender_username}</p>` : ''}
                    <p>${m.content}</p>
                </div>
            </div>`;
    }).join('') || '<p class="text-muted text-sm text-center py-8">Aucun message. Écrivez le premier !</p>';

    box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById('msg-input');
    const content = input.value.trim();
    if (!content || !currentConvId) return;

    const res = await fetch(`/api/conversations/${currentConvId}/send_message/`, {
        method: 'POST',
        headers: {
            'Authorization': 'Bearer ' + token(),
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ content })
    });

    if (res.ok) {
        input.value = '';
        openConversation(currentConvId);
        loadConversations();
    } else {
        alert('Erreur envoi message');
    }
}

document.addEventListener('DOMContentLoaded', loadConversations);
</script>
{% endblock %}
