{% extends "frontend/base.html" %}
{% block title %}Inscription — Covoiturage{% endblock %}

{% block content %}
<section class="w-full min-h-[calc(100vh-8rem)] flex items-center justify-center px-6 py-12 sm:py-16">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-full bg-brand-500 flex items-center justify-center font-bold text-black text-2xl mx-auto mb-4">C</div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Créer un compte</h1>
            <p class="text-sm text-muted mt-2">Rejoignez la communauté en 1 minute</p>
        </div>

        <div class="card rounded-3xl p-6 sm:p-8 border border-white/5">
            <div id="reg-error" class="hidden mb-4 p-3 rounded-xl bg-red-500/15 text-red-400 text-sm"></div>

            <form onsubmit="return handleRegister(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] uppercase tracking-wider text-muted mb-2 font-semibold">Nom d’utilisateur</label>
                    <input id="reg-username" type="text" required
                           class="w-full px-4 py-3.5 rounded-2xl elevated border border-soft text-sm focus:ring-2 focus:ring-brand-500/40 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-[11px] uppercase tracking-wider text-muted mb-2 font-semibold">Email</label>
                    <input id="reg-email" type="email" required
                           class="w-full px-4 py-3.5 rounded-2xl elevated border border-soft text-sm focus:ring-2 focus:ring-brand-500/40 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-[11px] uppercase tracking-wider text-muted mb-2 font-semibold">Téléphone</label>
                    <input id="reg-phone" type="text" placeholder="+237..."
                           class="w-full px-4 py-3.5 rounded-2xl elevated border border-soft text-sm focus:ring-2 focus:ring-brand-500/40 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-[11px] uppercase tracking-wider text-muted mb-2 font-semibold">Mot de passe</label>
                    <input id="reg-password" type="password" required minlength="8"
                           class="w-full px-4 py-3.5 rounded-2xl elevated border border-soft text-sm focus:ring-2 focus:ring-brand-500/40 focus:outline-none transition">
                </div>
                <button type="submit"
                        class="w-full py-3.5 rounded-2xl bg-brand-500 text-black font-bold text-sm hover:bg-brand-400 active:scale-[0.98] transition mt-2">
                    S’inscrire
                </button>
            </form>
        </div>

        <p class="text-center text-sm text-muted mt-6">
            Déjà un compte ?
            <a href="{% url 'frontend:login' %}" class="text-brand-500 font-semibold hover:underline">Connexion</a>
        </p>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
async function handleRegister(e) {
    e.preventDefault();
    const errorEl = document.getElementById('reg-error');
    errorEl.classList.add('hidden');
    const body = {
        username: document.getElementById('reg-username').value,
        email: document.getElementById('reg-email').value,
        phone: document.getElementById('reg-phone').value,
        password: document.getElementById('reg-password').value
    };
    try {
        const res = await fetch('/api/auth/register/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (res.ok) {
            const loginRes = await fetch('/api/auth/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: body.username, password: body.password })
            });
            const loginData = await loginRes.json();
            if (loginRes.ok) {
                localStorage.setItem('access_token', loginData.access);
                localStorage.setItem('refresh_token', loginData.refresh);
                await fetch('/api/session-login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: body.username, password: body.password })
                });
                window.location.href = '/';
            }
        } else {
            let msg = 'Erreur inscription';
            if (typeof data === 'object') msg = Object.values(data).flat().join(' ');
            errorEl.textContent = msg;
            errorEl.classList.remove('hidden');
        }
    } catch {
        errorEl.textContent = 'Erreur réseau';
        errorEl.classList.remove('hidden');
    }
    return false;
}
</script>
{% endblock %}
