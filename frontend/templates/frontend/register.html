{% extends "frontend/base.html" %}
{% block title %}Inscription — Covoiturage{% endblock %}

{% block content %}
<section class="w-full min-h-[70vh] flex items-center justify-center px-6 py-16">
    <div class="card rounded-2xl p-8 w-full max-w-md">
        <h1 class="text-xl font-semibold text-center mb-6">Créer un compte</h1>
        <div id="reg-error" class="hidden mb-4 p-3 rounded-lg bg-red-500/20 text-red-400 text-sm"></div>

        <form onsubmit="return handleRegister(event)" class="space-y-4">
            <input id="reg-username" type="text" placeholder="Nom d’utilisateur" required class="w-full px-4 py-3 rounded-xl elevated border border-soft text-sm focus:ring-2 focus:ring-brand-500/50 focus:outline-none">
            <input id="reg-email" type="email" placeholder="Email" required class="w-full px-4 py-3 rounded-xl elevated border border-soft text-sm focus:ring-2 focus:ring-brand-500/50 focus:outline-none">
            <input id="reg-phone" type="text" placeholder="Téléphone" class="w-full px-4 py-3 rounded-xl elevated border border-soft text-sm focus:ring-2 focus:ring-brand-500/50 focus:outline-none">
            <input id="reg-password" type="password" placeholder="Mot de passe" required minlength="8" class="w-full px-4 py-3 rounded-xl elevated border border-soft text-sm focus:ring-2 focus:ring-brand-500/50 focus:outline-none">
            <button type="submit" class="w-full py-3.5 rounded-xl bg-brand-500 text-black font-bold hover:bg-brand-400 transition">S’inscrire</button>
        </form>
        <p class="text-center text-sm text-muted mt-6">
            Déjà un compte ? <a href="{% url 'frontend:login' %}" class="text-brand-500 hover:underline">Connexion</a>
        </p>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
async function handleRegister(e) {
    e.preventDefault();
    const errorEl = document.getElementById('reg-error');
    errorEl.classList.add('hidden');
    const body = {
        username: document.getElementById('reg-username').value,
        email: document.getElementById('reg-email').value,
        phone: document.getElementById('reg-phone').value,
        password: document.getElementById('reg-password').value
    };
    const res = await fetch('/api/auth/register/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    const data = await res.json();
    if (res.ok) {
        // auto-login après inscription
        const loginRes = await fetch('/api/auth/login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: body.username, password: body.password })
        });
        const loginData = await loginRes.json();
        if (loginRes.ok) {
            localStorage.setItem('access_token', loginData.access);
            localStorage.setItem('refresh_token', loginData.refresh);
            window.location.href = '/';
        }
    } else {
        errorEl.textContent = JSON.stringify(data);
        errorEl.classList.remove('hidden');
    }
    return false;
}
</script>
{% endblock %}
