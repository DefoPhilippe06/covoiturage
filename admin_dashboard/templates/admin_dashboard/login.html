{% load static %}
<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Covoiturage Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #121212; color: #fff; }
        .card { background: #181818; }
        .accent { background: #1DB954; }
        .accent:hover { background: #1ed760; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-md rounded-2xl p-8 border border-white/5 shadow-2xl">
        <div class="flex items-center gap-3 mb-8 justify-center">
            <div class="w-12 h-12 rounded-full accent flex items-center justify-center font-bold text-black text-xl">C</div>
            <span class="text-2xl font-bold">Covoiturage</span>
        </div>

        <h1 class="text-xl font-semibold text-center mb-6">Connexion administrateur</h1>

        {% if form.errors %}
        <div class="mb-4 p-3 rounded-lg bg-red-500/20 text-red-400 text-sm">
            Identifiants incorrects.
        </div>
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm text-gray-400 mb-1.5">Nom d’utilisateur</label>
                <input type="text" name="username" required autofocus
                    class="w-full px-4 py-3 rounded-lg bg-[#282828] border border-white/10 focus:border-green-500 focus:outline-none transition">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1.5">Mot de passe</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-3 rounded-lg bg-[#282828] border border-white/10 focus:border-green-500 focus:outline-none transition">
            </div>
            <button type="submit" class="w-full py-3 rounded-full accent text-black font-bold transition">
                Se connecter
            </button>
        </form>
    </div>
</body>
</html>
