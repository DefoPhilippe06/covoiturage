{% load static %}
<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Admin Covoiturage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0a; color: #f5f5f5; }
        .card { background: #141414; border: 1px solid rgba(255,255,255,0.06); }
        .input {
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .input:focus {
            outline: none;
            border-color: rgba(29,185,84,0.5);
            box-shadow: 0 0 0 3px rgba(29,185,84,0.15);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-full bg-[#1DB954] flex items-center justify-center font-bold text-black text-2xl mx-auto mb-4">C</div>
            <h1 class="text-2xl font-bold tracking-tight">Administration</h1>
            <p class="text-sm text-neutral-400 mt-2">Espace réservé aux administrateurs</p>
        </div>

        <div class="card rounded-3xl p-6 sm:p-8 shadow-2xl">
            {% if form.errors %}
            <div class="mb-5 p-3 rounded-xl bg-red-500/15 text-red-400 text-sm">
                Identifiants incorrects ou accès non autorisé.
            </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-[11px] uppercase tracking-wider text-neutral-400 mb-2 font-semibold">Nom d’utilisateur</label>
                    <input type="text" name="username" required autofocus
                           class="input w-full px-4 py-3.5 rounded-2xl text-sm transition">
                </div>
                <div>
                    <label class="block text-[11px] uppercase tracking-wider text-neutral-400 mb-2 font-semibold">Mot de passe</label>
                    <input type="password" name="password" required
                           class="input w-full px-4 py-3.5 rounded-2xl text-sm transition">
                </div>
                <button type="submit"
                        class="w-full py-3.5 rounded-2xl bg-[#1DB954] text-black font-bold text-sm hover:bg-[#1ed760] active:scale-[0.98] transition">
                    Se connecter
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-neutral-500 mt-6">
            <a href="/" class="hover:text-[#1DB954] transition">← Retour au site</a>
        </p>
    </div>
</body>
</html>
